version: "3.9"

networks:
  snac-net:
    driver: bridge

services:
  # -------------------------------------------------
  # Core SNAC services (already running)
  # -------------------------------------------------
  snac-backend:
    image: snac-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
    networks:
      - snac-net
    depends_on:
      - snac-redis
      - snac-qdrant
  snac-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - snac-net

  snac-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    networks:
      - snac-net

  snac-qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - snac-net

  # -------------------------------------------------
  # NEW: Grafana (monitoring)
  # -------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - snac-net
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - snac-net

volumes:
  grafana-data:
