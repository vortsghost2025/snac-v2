version: "3.9"

services:
  # ---------------------------------------------------------
  # 1️⃣  Core SNAC API (Node + CUDA runtime)
  # ---------------------------------------------------------
  snac-api:
    build:
      context: .
      dockerfile: Dockerfile.gpu   # see section 2.1
    environment:
      - NODE_ENV=production
      - PORT=8000
      - KILO_WORKSPACE=/app/backend
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MLFLOW_URL=http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on: 
      - redis
      - qdrant
      - prometheus
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # 2️⃣  Message Bus (Redis)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ---------------------------------------------------------
  # 3️⃣  Vector DB (Qdrant – GPU enabled)
  # ---------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    environment:
      - QDRANT__STORAGE__GPU=true
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant_data
    runtime: nvidia
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # 4️⃣  Monitoring stack
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    restart: always

  # ---------------------------------------------------------
  # 5️⃣  GPU‑accelerated training worker (Python)
  # ---------------------------------------------------------
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer   # see section 2.2
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - REDIS_URL=redis://redis:6379
      - BASE_MODEL=microsoft/DialoGPT-medium
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data               # shared training data
      - ./models:/app/models           # model registry
    runtime: nvidia
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # 6️⃣  MLflow for model registry
  # ---------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.2
    ports: ["5000:5000"]
    volumes:
      - mlflow_data:/mlflow_data
    environment:
      - MLFLOW_BACKEND_STORE_URI=file:///mlflow_data
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=file:///mlflow_data/artifacts
    command: mlflow server --host 0.0.0.0 --port 5000 --artifacts-destination file:///mlflow_data/artifacts
    restart: always

  # ---------------------------------------------------------
  # 7️⃣  NVIDIA SMI Exporter for GPU metrics
  # ---------------------------------------------------------
  nvidia_exporter:
    image: nvidia/dcgm-exporter:latest
    ports: ["9400:9400"]
    runtime: nvidia
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  mlflow_data: