version: '3.8'

services:
  collab-hub:
    build: .
    container_name: collab-hub
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      - PORT=4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  ae-local-agent:
    build: .
    container_name: ae-local-agent
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - AGENT_TYPE=local
      - AGENT_PROFILE=local
    volumes:
      - ./memory-store.json:/usr/src/app/memory-store.json
      - ./orchestrator-memory.json:/usr/src/app/orchestrator-memory.json
    restart: unless-stopped
    networks:
      - ae-network

  ae-background-agent:
    build: .
    container_name: ae-background-agent
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - AGENT_TYPE=background
      - AGENT_PROFILE=background
    volumes:
      - ./memory-store.json:/usr/src/app/memory-store.json
    restart: unless-stopped
    networks:
      - ae-network

  ae-cloud-agent:
    build: .
    container_name: ae-cloud-agent
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - AGENT_TYPE=cloud
      - AGENT_PROFILE=cloud
    volumes:
      - ./memory-store.json:/usr/src/app/memory-store.json
    restart: unless-stopped
    networks:
      - ae-network

  ae-collab-hub:
    build: .
    container_name: ae-collab-hub
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    volumes:
      - ./memory-store.json:/usr/src/app/memory-store.json
    restart: unless-stopped
    networks:
      - ae-network

networks:
  ae-network:
    driver: bridge

volumes:
  memory_store:
  orchestrator_memory:
