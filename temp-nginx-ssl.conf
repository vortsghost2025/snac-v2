# Production nginx config with SSL/HTTPS
# Using existing Let's Encrypt certificate

# HTTP server - redirects to HTTPS
server {
    listen 80;
    server_name deliberatefederation.cloud orchestrator.deliberatefederation.cloud api.deliberatefederation.cloud agent.deliberatefederation.cloud 187.77.3.56;
    
    # Health check endpoint (HTTP)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    location /ready {
        access_log off;
        proxy_pass http://snac_backend:8000/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        error_page 502 503 504 =200 /health;
    }
    
    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name deliberatefederation.cloud orchestrator.deliberatefederation.cloud api.deliberatefederation.cloud agent.deliberatefederation.cloud 187.77.3.56;
    
    # SSL configuration (existing certificate)
    ssl_certificate /etc/letsencrypt/live/deliberatefederation.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deliberatefederation.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Health check endpoint (HTTPS)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    location /ready {
        access_log off;
        proxy_pass http://snac_backend:8000/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        error_page 502 503 504 =200 /health;
    }
    
    location / {
        proxy_pass http://snac_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    location /api/ {
        proxy_pass http://snac_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    location /orchestrator/ {
        rewrite ^/orchestrator(/.*)?$ /health break;
        proxy_pass http://snac-orchestrator:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    location /orchestrator {
        rewrite ^/orchestrator$ /health break;
        proxy_pass http://snac-orchestrator:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    location /agent/ {
        proxy_pass http://snac_free_coding_agent:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    location /ollama/ {
        proxy_pass http://snac_ollama:11434/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Longer timeout for LLM requests
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
