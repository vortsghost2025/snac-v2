version: "3.9"

networks:
  snac-net:
    external: true

services:
  # -------------------------------------------------
  # OpenClaw Server (AI agent framework)
  # -------------------------------------------------
  openclaw:
    image: python:3.12-slim
    container_name: snac_openclaw
    working_dir: /app
    command: >
      bash -c "
        pip install --no-cache-dir openclaw &&
        openclaw serve --config /etc/openclaw/config.yaml --host 0.0.0.0 --port 8080
      "
    ports:
      - "8080:8080"
    volumes:
      - openclaw-config:/etc/openclaw
      - openclaw-data:/root/.openclaw
      - ./config.yaml:/etc/openclaw/config.yaml:ro
    environment:
      - OPENCLAW_ENV=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TRUST_NETWORK_GATEWAY=ws://kilo-gateway:3002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - snac-net
    restart: unless-stopped

volumes:
  openclaw-config:
  openclaw-data:
